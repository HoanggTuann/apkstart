name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v0.5.8). Leave blank to use package.json version'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Portable
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve Release Tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) {
            $tag = "${{ github.ref_name }}"
            if ($tag -eq 'main' -or $tag -eq 'master') {
              $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
              $tag = "v$ver"
            }
          }
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          Write-Host "Release Tag: $tag"
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Run tests
        run: npm test

      - name: Build portable package
        run: npm run pack

      - name: Compress portable package
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          node build/zip.js dist/ApkStart-win64-portable "ApkStart-$tag-win64-portable.zip" --limit-mb 100
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item "ApkStart-$tag-win64-portable.zip" | Select-Object Name, Length

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $zip = "ApkStart-$tag-win64-portable.zip"
          $existing = gh release view $tag --json tagName -q .tagName 2>$null
          $notes = ".github/release-notes-$tag.md"
          if (-not $existing) {
            if (Test-Path $notes) {
              gh release create $tag --title "ApkStart $tag" --notes-file $notes
            } else {
              gh release create $tag --title "ApkStart $tag" --generate-notes
            }
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            gh release upload $tag $zip --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 15 }
          }
          if (-not $ok) { Write-Error "Upload failed: $zip"; exit 1 }
          gh release view $tag --json assets --jq '.assets[].name'

      - name: Sync portable to Gitee
        if: github.repository == 'RoutineMiku/apkstart'
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        shell: pwsh
        run: |
          if (-not $env:GITEE_TOKEN) {
            Write-Host "::notice::GITEE_TOKEN not set, skipping Gitee sync."
            exit 0
          }
          $tag = $env:RELEASE_TAG
          $notes = ".github/release-notes-$tag.md"
          if (Test-Path $notes) {
            node tools/publish-gitee.js $tag --zip "ApkStart-$tag-win64-portable.zip" --notes $notes
          } else {
            node tools/publish-gitee.js $tag --zip "ApkStart-$tag-win64-portable.zip"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  full:
    name: Build Full Standalone Installer
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Release Tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) {
            $tag = "${{ github.ref_name }}"
            if ($tag -eq 'main' -or $tag -eq 'master') {
              $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
              $tag = "v$ver"
            }
          }
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          Write-Host "Release Tag: $tag"
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Fetch runtime
        run: node build/fetch-runtime.js engine

      - name: Prepare runtime (xz compression)
        run: node build/prepare-runtime.js --force
        env:
          XZ_PRESET: '6'
          XZ_TIMEOUT_MS: '3600000'

      - name: Download VC++ Redistributable
        shell: pwsh
        run: |
          $dir = "build\runtime"
          if (-not (Test-Path $dir)) { New-Item -ItemType Directory -Force -Path $dir | Out-Null }
          $out = "$dir\vc_redist.x64.exe"
          Write-Output "Downloading VC++ 2015-2022 x64 redistributable..."
          curl.exe -L -o $out "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          if (-not (Test-Path $out) -or (Get-Item $out).Length -lt 1MB) { Write-Error "vc_redist download failed" }
          Get-Item $out | Select-Object Name, Length

      - name: Build full NSIS installer
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Full Installer to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $setup = Get-ChildItem dist/release/*Setup.exe | Select-Object -First 1
          if (-not $setup) { Write-Error "Setup.exe not found"; exit 1 }
          Write-Output ("Uploading {0} ({1:N0} MB)" -f $setup.Name, ($setup.Length / 1MB))
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            gh release upload $tag $setup.FullName --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 20 }
          }
          if (-not $ok) { Write-Error "Upload failed: $($setup.Name)"; exit 1 }
          gh release view $tag --json assets --jq '.assets[] | "\(.name) \(.size)"'

      - name: Package runtime bundle
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $zip = "ApkStart-runtime-$tag.zip"
          if (-not (Test-Path "build\runtime\emulator\emulator.exe")) { Write-Error "build\runtime incomplete"; exit 1 }
          tar.exe -a -cf $zip -C "build\runtime" .
          if ($LASTEXITCODE -ne 0) { Write-Error "Failed to package runtime"; exit 1 }
          Get-Item $zip | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Upload runtime bundle to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $zip = "ApkStart-runtime-$tag.zip"
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            gh release upload $tag $zip --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 20 }
          }
          if (-not $ok) { Write-Error "Upload failed: $zip"; exit 1 }
          gh release view $tag --json assets --jq '.assets[] | "\(.name) \(.size)"'
