      # ç¼º token æ—¶è¿™ä¸€æ­¥ä»ä¼šåœ¨æ—¥å¿—é‡Œæ ‡çº¢ï¼ˆcontinue-on-error æ˜¯ã€Œå¯è§ä½†éžè‡´å‘½ã€ï¼‰ï¼Œä¸é™é»˜ã€‚
      - name: åŒæ­¥ä¾¿æºç‰ˆåˆ° Gitee
