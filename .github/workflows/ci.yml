name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests (Windows / Node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Run unit tests
        run: npm test

      - name: Mouse hook smoke test
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          $out = & .\test\pointer-hook-logic.ps1
          $out | ForEach-Object { Write-Host $_ }
          if (-not ($out -contains 'POINTER_HOOK_LOGIC_OK')) { exit 1 }

  build:
    name: Build Portable (Windows x64)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (with Electron)
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Build portable package
        run: npm run pack

      - name: Compress portable package
        shell: pwsh
        run: |
          node build/zip.js dist/ApkStart-win64-portable ApkStart-win64-portable.zip --limit-mb 120
          Get-Item ApkStart-win64-portable.zip | Select-Object Name, Length

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApkStart-win64-portable
          path: ApkStart-win64-portable.zip
          retention-days: 14
