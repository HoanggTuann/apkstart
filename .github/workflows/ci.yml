      # å•å…ƒæµ‹è¯•ä¸éœ€è¦ Electron äºŒè¿›åˆ¶ï¼Œè·³è¿‡ 188MB ä¸‹è½½ä»¥åŠ å¿« CI
      - name: å®‰è£…ä¾èµ–
